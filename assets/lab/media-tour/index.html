<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>영상과 이 페이지 둘러보기</title>
<style>
@font-face{font-family:"Pretendard";src:url("../../fonts/Pretendard.woff2") format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#12263a;color:#e6ecf2;font:15px/1.6 "Pretendard",system-ui,sans-serif;display:grid;place-items:center;padding:clamp(12px,3vw,40px)}
figure{margin:0;width:min(100%,1280px);display:grid;gap:12px}
video{display:block;width:100%;height:auto;border-radius:14px;background:#fff;box-shadow:0 20px 40px -20px rgba(0,0,0,.6)}
figcaption{font-size:14px;color:#b8c7d6;word-break:keep-all}
</style>
</head>
<body>
<figure>
  <video src="../../media/lab_tour.mp4" poster="../../media/lab_media.jpg" autoplay muted loop playsinline controls aria-label="경력 아카이브 페이지를 훑어본 뒤 30초 경력 흐름 영상과 세로 영상 두 편이 이어지는 17초 둘러보기, 소리 없음"></video>
  <figcaption>이 페이지를 위에서부터 훑어본 뒤, 30초 경력 흐름 영상과 34초 소개·38초 묻고 답하기 세로 영상의 한 장면이 이어집니다. 소리는 없습니다.</figcaption>
</figure>
</body>
</html>
